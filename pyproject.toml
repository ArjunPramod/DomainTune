[project]
name = "domaintune"
version = "0.1.0"
description = "Receipt field extraction via a QLoRA-fine-tuned Qwen2.5-0.5B-Instruct"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "accelerate>=0.30",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domaintune"]
